name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build pinned PHP environment
        run: docker build --pull -t php-core-dev .

      - name: Install locked development tools
        run: >-
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL
          --security-opt no-new-privileges
          -v "$GITHUB_WORKSPACE:/workspace"
          -e COMPOSER_HOME=/tmp/composer-home
          -w /workspace php-core-dev composer install --no-interaction --prefer-dist

      - name: Run quality and distribution checks
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/php-core-distribution-evidence
        run: |
          mkdir -p "$EVIDENCE_DIR"
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$EVIDENCE_DIR:/evidence" \
            -e COMPOSER_HOME=/tmp/composer-home \
            -e OUTPUT_DIR=/evidence \
            -w /workspace php-core-dev composer quality && \
            docker run --rm --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$EVIDENCE_DIR:/evidence" \
            -e COMPOSER_HOME=/tmp/composer-home \
            -e OUTPUT_DIR=/evidence \
            -w /workspace php-core-dev composer distribution-smoke
